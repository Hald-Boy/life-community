server:
  port: 8083

spring:
  application:
    name: report-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/news_course_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.guat.cloud.report.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.guat.cloud.report.mapper: DEBUG
